name: holden-smoke-test
topology:
  nodes:
    node1:
      kind: linux
      image: holden-smoke-node:latest
      cmd: sleep infinity
      exec:
        - busybox ip addr add 192.0.2.1/30 dev eth1
    node2:
      kind: linux
      image: holden-smoke-node:latest
      cmd: sleep infinity
      exec:
        - busybox ip addr add 192.0.2.2/30 dev eth1
  links:
    - endpoints: ["node1:eth1", "node2:eth1"]
